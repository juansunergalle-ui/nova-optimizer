<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="novaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="novaGradSoft" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="hex">
      <polygon points="60,6 104,33 104,87 60,114 16,87 16,33"/>
    </clipPath>
  </defs>

  <!-- halo de fondo -->
  <polygon points="60,6 104,33 104,87 60,114 16,87 16,33"
           fill="none" stroke="url(#novaGrad)" stroke-width="2" opacity="0.9" filter="url(#glow)"/>

  <!-- relleno degradado suave -->
  <polygon points="60,10 100,35 100,85 60,110 20,85 20,35"
           fill="url(#novaGradSoft)"/>

  <!-- reticula interna -->
  <g clip-path="url(#hex)" opacity="0.5">
    <path d="M0 0 H120 M0 20 H120 M0 40 H120 M0 60 H120 M0 80 H120 M0 100 H120" stroke="#22d3ee" stroke-width="0.5"/>
    <path d="M0 0 V120 M20 0 V120 M40 0 V120 M60 0 V120 M80 0 V120 M100 0 V120" stroke="#22d3ee" stroke-width="0.5"/>
  </g>

  <!-- la "N" estilizada tipo abanico/radar -->
  <g filter="url(#glow)">
    <path d="M38 84 L38 36 L82 84 L82 36" fill="none" stroke="url(#novaGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 34 L72 34" stroke="#e879f9" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- destellos -->
  <circle cx="96" cy="26" r="3" fill="#e879f9" filter="url(#glow)"/>
  <circle cx="22" cy="96" r="2.2" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="20" cy="26" r="1.6" fill="#a5f3fc" opacity="0.8"/>
</svg>
